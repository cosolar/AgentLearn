[project]
name = "agentlearn"
version = "1.0.0"
description = "AI Agent 从零开始构建智能体 - 全面学习教程"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "AgentLearn Team", email = "team@agentlearn.dev"}
]
keywords = ["ai", "agent", "langchain", "langgraph", "tutorial", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # LangChain 核心（2026-10 基线）
    "langchain>=1.4.5",
    "langchain-core>=1.6.10",
    "langchain-community>=0.4.2",
    
    # LangChain 模型集成
    "langchain-openai>=1.7.1",
    "langchain-anthropic>=1.7.6",
    "langchain-google-genai>=4.4.1",
    "langchain-ollama>=1.1.0",
    
    # LangGraph（2026-10 基线）
    "langgraph>=1.2.15",
    "langgraph-checkpoint>=4.3.0",
    "langgraph-prebuilt>=1.1.0",
    "langgraph-sdk>=0.4.7",
    
    # 向量数据库
    "chromadb>=1.5.9",
    "faiss-cpu>=1.15.1",
    "qdrant-client>=1.19.1",
    
    # 嵌入模型
    "langchain-huggingface>=1.2.3",
    "sentence-transformers>=6.1.0",
    "huggingface-hub>=2.2.0",
    
    # 数据处理
    "beautifulsoup4>=4.15.0",
    "markdown>=3.11",
    "pypdf>=6.20.1",
    "python-docx>=1.2.0",
    "tiktoken>=0.14.0",
    
    # Web 框架
    "fastapi>=0.143.0",
    "uvicorn>=0.54.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    
    # 工具
    "python-dotenv>=1.2.4",
    "httpx>=0.28.1",
    # 测试
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    # 评估工具
    "ragas>=0.4.3",
    "streamlit>=1.65.0",
]

[project.optional-dependencies]
dev = [
    "black>=26.10.1",
    "ruff>=0.17.0",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
]
all = [
    "agentlearn[dev]",
]

[project.urls]
Homepage = "https://gitcode.com/mininote/AgentLearn"
Documentation = "https://gitcode.com/mininote/AgentLearn#readme"
Repository = "https://gitcode.com/mininote/AgentLearn.git"
Issues = "https://gitcode.com/mininote/AgentLearn/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentlearn"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
